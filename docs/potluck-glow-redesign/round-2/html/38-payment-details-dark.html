<!doctype html>

<title>Potluck: Payment details panel, Glow, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
input::placeholder{color:#A6A6BD}

th{font-size:12px;font-weight:700;color:#A6A6BD;text-align:left;padding:14px 12px 10px;border-bottom:1px solid #2C2C44;white-space:nowrap}

</head>
<body>
<div style="width: 440px; height: 560px; position: relative; overflow: hidden; box-sizing: border-box; padding: 20px; background: #0F0F1A; color: #F2F2F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; "><aside aria-label="Payment details" style="flex: 1 1 400px; min-width: 0; box-sizing: border-box; padding: 20px; background: #1C1C2E; border-radius: 24px; box-shadow: none; display: flex; flex-direction: column; gap: 14px; flex: 0 0 auto"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Matthew paid you <span style="font-size: 12px; font-weight: 600; margin-left: 6px; padding: 2px 8px; border-radius: 10px; background: #2F2A5C; color: #CFC7FF">Payment</span></h2><button aria-label="Close" style="height: 44px; min-width: 44px; padding: 0 6px; border: 0; background: none; color: #A6A6BD; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><kbd>Esc</kbd><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">CA$3.75</span><span style="font-size: 13px; color: #A6A6BD">Sep 17 · added by Matthew</span></div><div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; padding: 12px 14px; border-radius: 14px; background: #2A2A4A"><span style="font-weight: 600">You were paid</span><span style="font-size: 18px; font-weight: 800; color: #B3A6FF; font-variant-numeric: tabular-nums">CA$3.75 in</span></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600"><span style="height: 36px; padding: 0 12px 0 4px; border-radius: 18px; background: #2C2C44; font-weight: 700; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #7FE3D0; color: #063B33; font-size: 12px; font-weight: 800">M</span>Matthew</span><span>paid</span><span style="height: 36px; padding: 0 12px 0 4px; border-radius: 18px; background: #2C2C44; font-weight: 700; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #F2F2F8; color: #14142B; font-size: 10px; font-weight: 700">You</span>You</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: #26263C; font-size: 13px"><div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #A6A6BD">Note</span><span style="font-weight: 600">write off</span></div><div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #A6A6BD">Matthew still owes you</span><span style="font-weight: 700; color: #B3A6FF; font-variant-numeric: tabular-nums">CA$25.04</span></div></div><div style="display: flex; flex-wrap: wrap; gap: 8px"><button  style="height: 48px; padding: 0 16px; border: 0; border-radius: 24px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #F2F2F8; color: #0F0F1A; flex: 1 1 110px">Edit <kbd>E</kbd></button><button  style="height: 48px; padding: 0 16px; border: 0; border-radius: 24px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: none; color: #FF9A6B; padding: 0 4px; padding: 0 16px">Delete</button></div></aside></div>
