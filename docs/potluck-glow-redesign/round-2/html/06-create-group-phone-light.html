<!doctype html>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

<body>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; box-sizing: border-box; padding: 0; background: #F7F7FA; color: #14142B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.35; display: flex; flex-direction: column; "><header style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 12px 4px"><button aria-label="Back to home" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button><a href="#home" style="display: flex; align-items: center; gap: 10px; color: #14142B; text-decoration: none"><span aria-hidden="true" style="font-size: 28px; line-height: 1">🍲</span><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Potluck</span></a></header><main style="box-sizing: border-box; padding: 14px 16px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(20,20,43,0.06), 0 8px 24px rgba(20,20,43,0.05); margin: 4px 16px 0; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Create a group</h1><span style="font-size: 13px; color: #5C5C73">It takes a few seconds and needs no account.</span></div><div style="padding: 16px; border-radius: 20px; color: #FFFFFF; background: radial-gradient(90% 120% at 100% 0%, #A02C88 0%, rgba(160,44,136,0) 60%), radial-gradient(100% 120% at 0% 100%, #2A1FB0 0%, rgba(42,31,176,0) 70%), #4A35E8; display: flex; align-items: flex-end; gap: 12px"><button aria-label="Group emoji: pot of food. Change" style="width: 64px; height: 64px; flex-shrink: 0; border: 0; border-radius: 16px; background: rgba(255,255,255,0.16); font-size: 32px; line-height: 1; cursor: pointer">🍲</button><label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span>Group name</span><span>9/50</span></span><input type="text" value="Veld 2026" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0; border: 0; outline: 0; background: none; color: #FFFFFF; font-size: 32px; font-weight: 800; letter-spacing: -0.02em"></label></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600"><span>Track balances in</span><button style="height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: #ECECF4; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer">CAD <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button><span style="font-size: 13px; font-weight: 400; color: #5C5C73">Canadian dollar</span></div><div style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5C73">Who's in it</span><span style="font-size: 13px; color: #5C5C73">4 people</span></div><div style="display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 10px; min-height: 48px; "><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #FFE3D3; color: #5A2200; font-size: 13px; font-weight: 800">J</span><span style="flex-grow: 1; min-width: 0; font-weight: 600">Jacky<span style="font-size: 12px; font-weight: 600; margin-left: 6px; padding: 2px 8px; border-radius: 10px; background: #ECE9FF; color: #3F2FD0">You</span></span><button aria-label="Remove Jacky" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: none; color: #B4420A; padding: 0 4px; font-size: 13px">Remove</button></div><div style="display: flex; align-items: center; gap: 10px; min-height: 48px; border-top: 1px solid #EEEEF3; "><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #DCEBFF; color: #0B2B55; font-size: 13px; font-weight: 800">S</span><span style="flex-grow: 1; min-width: 0; font-weight: 600">Stephen</span><button aria-label="Remove Stephen" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: none; color: #B4420A; padding: 0 4px; font-size: 13px">Remove</button></div><div style="display: flex; align-items: center; gap: 10px; min-height: 48px; border-top: 1px solid #EEEEF3; "><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #FFDDEA; color: #4F0A2A; font-size: 13px; font-weight: 800">A</span><span style="flex-grow: 1; min-width: 0; font-weight: 600">Angus</span><button aria-label="Remove Angus" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: none; color: #B4420A; padding: 0 4px; font-size: 13px">Remove</button></div><div style="display: flex; align-items: center; gap: 10px; min-height: 48px; border-top: 1px solid #EEEEF3; "><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #FFEDBF; color: #4A3000; font-size: 13px; font-weight: 800">A</span><span style="flex-grow: 1; min-width: 0; font-weight: 600">Alvin</span><button aria-label="Remove Alvin" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: none; color: #B4420A; padding: 0 4px; font-size: 13px">Remove</button></div></div><div style="display: flex; gap: 8px"><input type="text" aria-label="Add a person by name" value="" placeholder="Add a name" style="height: 40px; box-sizing: border-box; min-width: 0; padding: 0 12px; border: 0; outline: 0; border-radius: 12px; background: #F4F4F9; font-weight: 700; flex: 1 1 0; height: 44px"><button  style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #ECECF4; color: #14142B; ">Add</button></div><span style="font-size: 13px; color: #5C5C73">Names are enough. Nobody needs an account, and you can add or rename people later.</span></div></main><div style="margin-top: auto; display: flex; padding: 12px 16px 20px"><button  style="height: 52px; padding: 0 16px; border: 0; border-radius: 26px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 16px; background: #14142B; color: #FFFFFF; flex: 1 1 0">Create group</button></div></div>
