or: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">A</span><span style="font-size: 13px">Angus</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">−11.63</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: #0F0F1A; color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">J</span><span style="font-size: 13px">Jacky</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">−7.80</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">M</span><span style="font-size: 13px">Matthew</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">0.00</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">J</span><span style="font-size: 13px">Jonah</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">0.00</span></button></div></section><span style="font-size: 13px; font-weight: 600;
