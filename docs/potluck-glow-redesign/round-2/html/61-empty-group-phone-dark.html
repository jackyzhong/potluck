<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potluck: Empty group, phone, Glow, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
input::placeholder{color:#A6A6BD}
a{color:#B3A6FF}
kbd{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:12px;font-weight:600;padding:1px 6px;border:1px solid #4A4A70;border-radius:6px;background:#0F0F1A;color:#DADAE8}
th{font-size:12px;font-weight:700;color:#A6A6BD;text-align:left;padding:14px 12px 10px;border-bottom:1px solid #2C2C44;white-space:nowrap}
td{padding:0 12px;height:56px;border-bottom:1px solid #26263C;white-space:nowrap}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 0; background: #0F0F1A; color: #F2F2F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.35; display: flex; flex-direction: column; "><header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 4px"><button aria-label="Back to groups" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button><span aria-hidden="true" style="font-size: 24px; line-height: 1">🍲</span><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Veld 2026</h1><span style="font-size: 12px; font-weight: 600; color: #A6A6BD">Viewing as Jacky</span></div><button  style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #1C1C2E; color: #F2F2F8; box-shadow: none; ">Invite</button><button aria-label="Switch person" style="height: 44px; padding: 0 8px 0 4px; border: 0; border-radius: 22px; background: #1C1C2E; box-shadow: none; display: flex; align-items: center; gap: 4px; cursor: pointer"><span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: #FFB38A; color: #4A1E00; font-size: 14px; font-weight: 800">J</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button></header><div role="tablist" aria-label="Group views" style="display: flex; gap: 4px; margin: 0 16px; padding: 4px; background: #1C1C2E; border-radius: 26px"><button role="tab" aria-selected="true" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 22px; background: #3A3A5E; box-shadow: none; font-weight: 700; cursor: pointer">Activity</button><button role="tab" aria-selected="false" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 22px; background: none; color: #C3C3D6; font-weight: 600; cursor: pointer">Balances</button></div><section style="margin: 16px 16px 0; padding: 20px 16px 14px; border-radius: 24px; color: #FFFFFF; background: radial-gradient(90% 120% at 100% 0%, #A02C88 0%, rgba(160,44,136,0) 60%), radial-gradient(100% 120% at 0% 100%, #2A1FB0 0%, rgba(42,31,176,0) 70%), #4A35E8; box-shadow: 0 12px 36px rgba(106,85,245,0.35); display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px"><span style="font-size: 14px; font-weight: 600">You're all settled</span><span style="font-size: 54px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">CA$0.00</span><span style="font-size: 13px">Nothing owed either way</span></div></section><main style="box-sizing: border-box; padding: 0 14px; background: #1C1C2E; border-radius: 20px; box-shadow: none; margin: 16px 16px 0"><div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 16px; text-align: center"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">No expenses yet</span><span style="color: #A6A6BD">Add the first one and Potluck keeps the tally.</span></div><button  style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #2C2C44; color: #F2F2F8; ">Add expense</button></div></main><div style="margin-top: auto; display: flex; gap: 10px; padding: 12px 16px 20px"><button  style="height: 52px; padding: 0 16px; border: 0; border-radius: 26px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 16px; background: #1C1C2E; color: #F2F2F8; box-shadow: none; flex: 1 1 0">Add payment</button><button  style="height: 52px; padding: 0 16px; border: 0; border-radius: 26px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 16px; background: #F2F2F8; color: #0F0F1A; flex: 1 1 0">Add expense</button></div></div>
</body>
</html>
