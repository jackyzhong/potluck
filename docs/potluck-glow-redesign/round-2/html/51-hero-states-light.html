<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potluck: Balance card states, Glow, light</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
input::placeholder{color:#5C5C73}
a{color:#3F2FD0}
kbd{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:12px;font-weight:600;padding:1px 6px;border:1px solid #D0D0DC;border-radius:6px;background:#FFFFFF;color:#4A4A63}
th{font-size:12px;font-weight:700;color:#5C5C73;text-align:left;padding:14px 12px 10px;border-bottom:1px solid #EEEEF3;white-space:nowrap}
td{padding:0 12px;height:56px;border-bottom:1px solid #F1F1F5;white-space:nowrap}
</style>
</head>
<body>
<div style="width: 900px; height: 760px; position: relative; overflow: hidden; box-sizing: border-box; padding: 24px; background: #F7F7FA; color: #14142B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 13px; font-weight: 600; color: #5C5C73">Viewer owes money (viewing as Alvin)</span><section style="flex: 0 0 auto; min-width: 0; box-sizing: border-box; padding: 20px; border-radius: 24px; color: #FFFFFF; background: radial-gradient(70% 140% at 100% 0%, #A02C88 0%, rgba(160,44,136,0) 65%), radial-gradient(80% 140% at 0% 100%, #2A1FB0 0%, rgba(42,31,176,0) 70%), #4A35E8; box-shadow: 0 12px 28px rgba(74,53,232,0.26); display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px"><div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">You owe</span><span style="font-size: 60px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">CA$64.60</span><span style="font-size: 13px">You owe 3 people</span></div><div aria-label="Balances by person" style="flex: 2 1 360px; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px"><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: #14142B; color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">S</span><span style="font-size: 13px">Stephen</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">−45.17</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: #14142B; color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">A</span><span style="font-size: 13px">Angus</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">−11.63</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: #14142B; color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">J</span><span style="font-size: 13px">Jacky</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">−7.80</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">M</span><span style="font-size: 13px">Matthew</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">0.00</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; border: 0; border-radius: 16px; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer"><span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; color: #2A1FB0; font-weight: 800; display: flex; align-items: center; justify-content: center">J</span><span style="font-size: 13px">Jonah</span><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">0.00</span></button></div></section><span style="font-size: 13px; font-weight: 600; color: #5C5C73">Viewer is settled</span><section style="flex: 0 0 auto; min-width: 0; box-sizing: border-box; padding: 20px; border-radius: 24px; color: #FFFFFF; background: radial-gradient(70% 140% at 100% 0%, #A02C88 0%, rgba(160,44,136,0) 65%), radial-gradient(80% 140% at 0% 100%, #2A1FB0 0%, rgba(42,31,176,0) 70%), #4A35E8; box-shadow: 0 12px 28px rgba(74,53,232,0.26); display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px"><div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">You're all settled</span><span style="font-size: 60px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">CA$0.00</span><span style="font-size: 13px">Nothing owed either way</span></div></section><span style="font-size: 13px; font-weight: 600; color: #5C5C73">Balances tab when everyone is settled</span><section style="box-sizing: border-box; padding: 20px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(20,20,43,0.06), 0 8px 24px rgba(20,20,43,0.05); display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Settle-up plan</h2><span style="font-size: 13px; color: #5C5C73">Nothing to settle</span></div><p style="margin: 0; padding: 32px 0; text-align: center; color: #5C5C73">Nobody owes anybody. Add an expense and the plan updates.</p></section></div>
</body>
</html>
