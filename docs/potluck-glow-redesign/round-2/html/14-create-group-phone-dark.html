<div style="width: 390px; height: 900px; position: relative; overflow: hidden; box-sizing: border-box; padding: 0; background: #0F0F1A; color: #F2F2F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.35; display: flex; flex-direction: column; "><header style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 12px 4px"><button aria-label="Back to home" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button><a href="#home" style="display: flex; align-items: center; gap: 10px; color: #F2F2F8; text-decoration: none"><span aria-hidden="true" style="font-size: 28px; line-height: 1">🍲</span><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Potluck</span></a></header><main style="box-sizing: border-box; padding: 14px 16px; background: #1C1C2E; border-radius: 20px; box-shadow: none; margin: 4px 16px 0; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Create a group</h1><span style="font-size: 13px; color: #A6A6BD">It takes a few seconds and needs no account.</span></div><div style="padding: 16px; border-radius: 20px; color: #FFFFFF; background: radial-gradient(90% 120% at 100% 0%, #A02C88 0%, rgba(160,44,136,0) 60%), radial-gradient(100% 120% at 0% 100%, #2A1FB0 0%, rgba(42,31,176,0) 70%), #4A35E8; display: flex; align-items: flex-end; gap: 12px"><button aria-label="Group emoji: pot of food. Change" style="width: 64px; height: 64px; flex-shrink: 0; border: 0; border-radius: 16px; background: rgba(255,255,255,0.16); font-size: 32px; line-height: 1; cursor: pointer
