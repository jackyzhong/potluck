<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Potluck add expense: exact split, Glow, dark</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
input::placeholder{color:#A6A6BD}
kbd{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:12px;font-weight:600;padding:1px 6px;border:1px solid #4A4A70;border-radius:6px;background:#0F0F1A;color:#DADAE8}
</style>
<div style="width: 440px; height: 1000px; box-sizing: border-box; padding: 20px; background: #0F0F1A; color: #F2F2F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4">
<aside aria-label="Add expense" style="flex: 1 1 400px; min-width: 0; box-sizing: border-box; padding: 20px; background: #1C1C2E; border-radius: 24px; box-shadow: 0 1px 2px rgba(20,20,43,0.06), 0 8px 24px rgba(20,20,43,0.05); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Add expense</h2>
<button aria-label="Close" style="height: 44px; min-width: 44px; padding: 0 6px; border: 0; background: none; color: #A6A6BD; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><kbd>Esc</kbd><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div style="padding: 16px; border-radius: 20px; color: white; background: radial-gradient(90% 120% at 100% 0%, #A02C88 0%, rgba(160,44,136,0) 60%), radial-gradient(100% 120% at 0% 100%, #2A1FB0 0%, rgba(42,31,176,0) 70%), #4A35E8; display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span>What was it for?</span><span>19/50</span></span>
<input type="text" value="Late-night shawarma" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 0; outline: 0; border-radius: 12px; background: rgba(255,255,255,0.16); font-weight: 600">
</label>
<div style="display: flex; align-items: flex-end; gap: 10px">
<label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600">Amount</span>
<input type="text" value="64.50" style="width: 100%; box-sizing: border-box; height: 56px; padding: 0; border: 0; outline: 0; background: none; font-size: 48px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">
</label>
<button aria-label="Currency: Canadian dollars" style="height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.16); font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">CAD <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600">
<span>Paid by</span>
<button style="height: 44px; padding: 0 12px 0 6px; border: 0; border-radius: 22px; background: #2C2C44; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer"><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #F2F2F8; color: #0F0F1A; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">You</span>You <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
<span>on</span>
<button style="height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: #2C2C44; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">Today <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
<div role="tablist" aria-label="How to split" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #2C2C44; border-radius: 16px">
<button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 12px; background: none; color: #C3C3D6; font-weight: 600; cursor: pointer">Equally</button>
<button role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 12px; background: #3A3A5E; font-weight: 700; cursor: pointer">Exact</button>
<button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 12px; background: none; color: #C3C3D6; font-weight: 600; cursor: pointer">Percent</button>
<button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 12px; background: none; color: #C3C3D6; font-weight: 600; cursor: pointer">Shares</button>
</div>
<div style="display: flex; flex-direction: column">
<label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 132px; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #F2F2F8; color: #0F0F1A; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">You</span>
<span style="font-weight: 600">You</span>
<span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: #26263C; font-variant-numeric: tabular-nums"><span style="font-size: 13px; color: #A6A6BD">CA$</span><input type="text" value="20.00" aria-label="Your amount" style="flex: 1 1 0; min-width: 0; width: 100%; border: 0; outline: 0; background: none; text-align: right; font-weight: 700"></span>
</label>
<label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 132px; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #9CC9FF; color: #0B2B55; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">S</span>
<span style="font-weight: 600">Stephen</span>
<span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: #26263C; font-variant-numeric: tabular-nums"><span style="font-size: 13px; color: #A6A6BD">CA$</span><input type="text" value="14.50" aria-label="Stephen's amount" style="flex: 1 1 0; min-width: 0; width: 100%; border: 0; outline: 0; background: none; text-align: right; font-weight: 700"></span>
</label>
<label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 132px; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #FF9EC4; color: #4F0A2A; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">A</span>
<span style="font-weight: 600">Angus</span>
<span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: #26263C; font-variant-numeric: tabular-nums"><span style="font-size: 13px; color: #A6A6BD">CA$</span><input type="text" placeholder="0.00" aria-label="Angus's amount" style="flex: 1 1 0; min-width: 0; width: 100%; border: 0; outline: 0; background: none; text-align: right; font-weight: 700"></span>
</label>
<label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 132px; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #FFD166; color: #4A3000; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">A</span>
<span style="font-weight: 600">Alvin</span>
<span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: #26263C; font-variant-numeric: tabular-nums"><span style="font-size: 13px; color: #A6A6BD">CA$</span><input type="text" value="10.00" aria-label="Alvin's amount" style="flex: 1 1 0; min-width: 0; width: 100%; border: 0; outline: 0; background: none; text-align: right; font-weight: 700"></span>
</label>
<label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 132px; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #7FE3D0; color: #063B33; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</span>
<span style="font-weight: 600">Matthew</span>
<span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: #26263C; font-variant-numeric: tabular-nums"><span style="font-size: 13px; color: #A6A6BD">CA$</span><input type="text" placeholder="0.00" aria-label="Matthew's amount" style="flex: 1 1 0; min-width: 0; width: 100%; border: 0; outline: 0; background: none; text-align: right; font-weight: 700"></span>
</label>
<label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 132px; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #B9A7FF; color: #1D1147; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">J</span>
<span style="font-weight: 600">Jonah</span>
<span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: #26263C; font-variant-numeric: tabular-nums"><span style="font-size: 13px; color: #A6A6BD">CA$</span><input type="text" placeholder="0.00" aria-label="Jonah's amount" style="flex: 1 1 0; min-width: 0; width: 100%; border: 0; outline: 0; background: none; text-align: right; font-weight: 700"></span>
</label>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; padding: 10px 14px; border-radius: 14px; background: #3A2418; font-size: 13px; font-variant-numeric: tabular-nums">
<span style="font-weight: 700; color: #FF9A6B">CA$20.00 left to assign</span>
<span>CA$44.50 of CA$64.50</span>
</div>
<button style="height: 44px; border: 0; border-radius: 22px; background: #2C2C44; font-weight: 700; cursor: pointer">Split CA$20.00 across the 3 blank rows</button>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="flex: 1 1 150px; height: 48px; border: 0; border-radius: 24px; background: #2C2C44; font-weight: 700; cursor: pointer">Save and add another</button>
<button aria-disabled="true" style="flex: 1 1 150px; height: 48px; border: 0; border-radius: 24px; background: #26263C; color: #A6A6BD; font-weight: 700; cursor: not-allowed">Assign CA$20.00 more to save</button>
</div>
</aside>
</div>
</body>
</html>
